{{ define "main" }}
  <section class="py-16">
    <div class="container mx-auto px-4">

      <!-- Zurück-Button -->
      <div class="mb-8">
        <a href="{{ .Parent.RelPermalink }}"
          class="border-primary text-primary hover:bg-primary inline-flex items-center gap-2 rounded border px-6 py-2 duration-500 hover:text-white">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
          </svg>
          {{ i18n "back" | default "Zurück" }}
        </a>
      </div>

      <div class="flex items-baseline justify-between gap-4 mb-4">
        {{ with .Title }}
          <h1 class="text-primary text-left text-4xl font-bold">{{ . }}</h1>
        {{ end }}
        {{ with .Date }}
          <span class="text-sm text-gray-400 whitespace-nowrap">{{ .Format "02.01.2006" }}</span>
        {{ end }}
      </div>
      {{ with .Params.description }}
        <p class="mb-8 text-left text-lg text-gray-600">{{ . }}</p>
      {{ end }}
      {{ with .Content }}
        <div class="prose-full">
          {{ . }}
        </div>
      {{ end }}
    </div>
  </section>
{{ end }}
